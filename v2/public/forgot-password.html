<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password — Collectrr</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #F8F7F4;
        --surface: #FFFFFF;
        --border: #ECE8DF;
        --text: #171717;
        --muted: #6E6A62;
        --accent: #171717;
        --accent-ring: rgba(23, 23, 23, 0.1);
        --btn-primary-bg: #171717;
        --btn-primary-hover: #2A2A2A;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 440px;
      }
      .brand-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }
      .brand-icon {
        width: 44px; height: 44px;
        background: #171717;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-weight: 600; font-size: 1.25rem;
      }
      .brand-title h1 { font-size: 22px; font-weight: 600; color: #171717; }
      .brand-title p { font-size: 13px; color: var(--muted); margin-top: 0.1rem; }

      .form-group { margin-bottom: 1.25rem; }
      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #171717;
        margin-bottom: 0.4rem;
      }
      .input-field {
        width: 100%;
        height: 44px;
        padding: 0 1rem;
        background: #FCFBF8;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: #171717;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
      }
      .input-field:focus {
        border-color: #171717;
        box-shadow: 0 0 0 3px var(--accent-ring);
      }
      .btn-submit {
        width: 100%;
        height: 44px;
        padding: 0 1rem;
        background: var(--btn-primary-bg);
        color: #ffffff;
        font-weight: 500;
        font-size: 15px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: background 150ms ease-out;
        margin-top: 0.5rem;
      }
      .btn-submit:hover { background: var(--btn-primary-hover); }
      .error-alert {
        background: #FEE2E2;
        border: 1px solid #FECACA;
        color: #DC2626;
        padding: 0.875rem;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 1.25rem;
      }
      .success-alert {
        background: #DCFCE7;
        border: 1px solid #BBF7D0;
        color: #166534;
        padding: 0.875rem;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a href="/login.html" style="font-size: 13px; color: var(--muted); text-decoration: none;">← Back to Sign In</a>
      </div>
      <div class="brand-header">
        <div class="brand-icon">C</div>
        <div class="brand-title">
          <h1>Reset Password</h1>
          <p>Set a new password for your account</p>
        </div>
      </div>

      <div id="errorAlert" class="error-alert" hidden></div>
      <div id="successAlert" class="success-alert" hidden></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="input-field" placeholder="Enter your username" required autofocus />
        </div>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="input-field" placeholder="Enter new password (min 6 chars)" minlength="6" required />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm new password" minlength="6" required />
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Update Password</button>
        <div style="text-align: center; margin-top: 1rem; font-size: 0.8125rem; color: var(--muted);">
          Remembered your password? <a href="/login.html" style="color: #171717; text-decoration: none; font-weight: 600;">Sign in</a>
        </div>
      </form>
    </div>

    <script>
      const form = document.getElementById('resetForm');
      const errBox = document.getElementById('errorAlert');
      const successBox = document.getElementById('successAlert');
      const submitBtn = document.getElementById('submitBtn');

      form.onsubmit = async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        successBox.hidden = true;

        const username = document.getElementById('username').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
          errBox.textContent = 'Passwords do not match.';
          errBox.hidden = false;
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, newPassword })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to reset password');

          successBox.textContent = data.message || 'Password updated successfully! Redirecting to sign in...';
          successBox.hidden = false;
          form.reset();

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        } catch (err) {
          errBox.textContent = err.message;
          errBox.hidden = false;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      };
    </script>
  </body>
</html>
