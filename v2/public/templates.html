<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Templates — Collectrr</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .template-card {
      background: #ffffff;
      border: 1px solid #ECE8DF;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      position: relative;
    }
    .template-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      border-color: #DDD8CE;
    }
    .template-preview-box {
      background: #FAF9F6;
      border: 1px solid #ECE8DF;
      border-radius: 10px;
      padding: 14px;
      margin: 14px 0;
      font-size: 13px;
      line-height: 1.5;
      color: #171717;
      min-height: 110px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .var-token {
      display: inline-block;
      background: #FEF3C7;
      color: #92400E;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
    }
    .channel-badge-wa {
      background: #E6F4ED;
      color: #166534;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .channel-badge-em {
      background: #EEF2FF;
      color: #3730A3;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #ECE8DF;
      background: #ffffff;
      font-size: 13px;
      font-weight: 500;
      color: #6E6A62;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill-btn.active {
      background: #171717;
      color: #ffffff;
      border-color: #171717;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      border: 1px solid #ECE8DF;
      display: flex;
      flex-direction: column;
    }
    .form-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #171717;
    }
    .form-input, .form-textarea, .form-select {
      padding: 9px 12px;
      border: 1px solid #ECE8DF;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      color: #171717;
      background: #FCFBF8;
      outline: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: #171717;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <div class="app-layout">
    <main class="main-content" style="width: 100%; max-width: 1440px; margin: 0 auto; padding: 32px 40px;">
      
      <!-- Top Navigation Bar -->
      <nav class="top-nav-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #ffffff; border: 1px solid #ECE8DF; margin-bottom: 24px; border-radius: 12px;">
        <div style="display: flex; align-items: center; gap: 2rem;">
          <a href="/dashboard" class="top-nav-brand" style="display: flex; align-items: center; gap: 0.625rem; text-decoration: none; cursor: pointer;">
            <div class="brand-icon" style="width: 32px; height: 32px; background: #171717; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 600; font-size: 1rem;">C</div>
            <div class="brand-text">
              <h2 style="font-size: 1.15rem; font-weight: 600; color: #171717; margin: 0;">Collectrr</h2>
            </div>
          </a>
          
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <a href="/dashboard" style="padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 13px; font-weight: 500; color: #6E6A62; text-decoration: none; transition: background 0.15s;">Contacts</a>
            <a href="/campaigns.html" style="padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 13px; font-weight: 500; color: #6E6A62; text-decoration: none; transition: background 0.15s;">Campaigns</a>
            <a href="/templates.html" style="padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 13px; font-weight: 600; color: #171717; background: #F4F3EF; text-decoration: none;">Templates</a>
          </div>
        </div>

        <div class="top-nav-right" style="display: flex; align-items: center; gap: 0.75rem;">
          <a href="/admin/analytics" id="navAnalytics" style="display: none; padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 13px; color: #6E6A62; text-decoration: none;">Analytics</a>
          <a href="/observability" id="navObservability" style="display: none; padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 13px; color: #6E6A62; text-decoration: none;">Observability</a>

          <div style="position: relative;">
            <div class="sidebar-user" id="topUserContainer" onclick="toggleUserDropdown(event)" style="display: flex; align-items: center; gap: 0.625rem; padding: 0.35rem 0.875rem; background: #F4F3EF; border: 1px solid #ECE8DF; border-radius: 999px; cursor: pointer;">
              <div class="user-avatar" id="userAvatar" style="width: 30px; height: 30px; font-size: 13px; background: #171717; color: #ffffff;">--</div>
              <div class="user-info" style="line-height: 1.2;">
                <div id="userName" style="font-size: 13px; font-weight: 600; color: #171717;">User</div>
                <div id="userRole" style="font-size: 12px; color: #6E6A62;">Workspace</div>
              </div>
            </div>

            <div id="userDropdownMenu" style="display: none; position: absolute; right: 0; top: calc(100% + 8px); background: #ffffff; border: 1px solid #ECE8DF; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 8px; min-width: 180px; z-index: 1000;">
              <div style="padding: 8px 12px; border-bottom: 1px solid #F4F3EF; margin-bottom: 4px;">
                <div id="dropdownUserName" style="font-size: 13px; font-weight: 600; color: #171717;">User</div>
                <div id="dropdownUserRole" style="font-size: 12px; color: #6E6A62;">Workspace</div>
              </div>
              <button type="button" onclick="handleLogout()" style="width: 100%; text-align: left; padding: 8px 12px; border: none; background: transparent; font-size: 13px; color: #DC2626; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500;">
                Log out
              </button>
            </div>
          </div>
        </div>
      </nav>

      <!-- Page Header -->
      <section style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div>
          <h1 style="font-size: 22px; font-weight: 600; color: #171717; margin: 0;">Message Templates</h1>
        </div>
        <div>
          <button type="button" onclick="openCreateTemplateModal()" class="btn-primary" style="background: #171717; color: #ffffff; padding: 9px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;">
            <span>+ Create Template</span>
          </button>
        </div>
      </section>

      <!-- Channel Filters -->
      <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 16px;">
        <button type="button" class="pill-btn active" id="filterAll" onclick="setChannelFilter('all')">All Channels</button>
        <button type="button" class="pill-btn" id="filterWhatsApp" onclick="setChannelFilter('whatsapp')">WhatsApp</button>
        <button type="button" class="pill-btn" id="filterEmail" onclick="setChannelFilter('email')">Email</button>
        <button type="button" class="pill-btn" id="filterCustom" onclick="setChannelFilter('custom')">Custom Only</button>
      </div>

      <!-- Templates Grid Container -->
      <div id="templatesContainer" class="template-grid">
        <div style="grid-column: 1 / -1; text-align: center; padding: 48px 0; color: #6E6A62;">Loading templates...</div>
      </div>

    </main>
  </div>

  <!-- Create / Edit Template Modal -->
  <div id="templateModal" class="modal-overlay">
    <div class="modal-card">
      <div style="padding: 20px 24px; border-bottom: 1px solid #ECE8DF; display: flex; justify-content: space-between; align-items: center;">
        <h3 id="modalTitle" style="font-size: 16px; font-weight: 600; color: #171717; margin: 0;">New Message Template</h3>
        <button type="button" onclick="closeTemplateModal()" style="border: none; background: transparent; font-size: 20px; cursor: pointer; color: #6E6A62;">&times;</button>
      </div>

      <div style="padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
        <!-- Left: Form -->
        <form id="templateForm" onsubmit="handleSaveTemplate(event)">
          <input type="hidden" id="editingTemplateId" value="" />

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Channel</label>
              <select id="tplChannel" class="form-select" onchange="handleChannelChange()">
                <option value="whatsapp">WhatsApp</option>
                <option value="email">Email</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Identifier (Unique Name)</label>
              <input type="text" id="tplName" class="form-input" placeholder="e.g. founder_followup_v1" required />
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label">Display Title</label>
            <input type="text" id="tplDisplayName" class="form-input" placeholder="e.g. Founder Intro & Followup" required />
          </div>

          <!-- WhatsApp-specific fields -->
          <div id="waFields">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Category</label>
                <select id="tplCategory" class="form-select">
                  <option value="UTILITY">Utility</option>
                  <option value="MARKETING">Marketing</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Language</label>
                <select id="tplLanguage" class="form-select">
                  <option value="en">English (en)</option>
                  <option value="en_US">English US (en_US)</option>
                  <option value="hi">Hindi (hi)</option>
                </select>
              </div>
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
              <label class="form-label">Header (Optional)</label>
              <input type="text" id="tplHeader" class="form-input" placeholder="e.g. Important Notice" oninput="updateLivePreview()" />
            </div>
          </div>

          <!-- Email-specific fields -->
          <div id="emailFields" style="display: none;">
            <div class="form-group" style="margin-bottom: 16px;">
              <label class="form-label">Subject Line</label>
              <input type="text" id="tplSubject" class="form-input" placeholder="e.g. Introduction & next steps with {{company}}" oninput="updateLivePreview()" />
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="form-label">Message Body</label>
              <div style="display: flex; gap: 4px;">
                <button type="button" onclick="insertVariable('{{name}}')" style="padding: 2px 6px; font-size: 11px; border: 1px solid #ECE8DF; border-radius: 4px; background: #FEF3C7; color: #92400E; cursor: pointer;">+ name</button>
                <button type="button" onclick="insertVariable('{{company}}')" style="padding: 2px 6px; font-size: 11px; border: 1px solid #ECE8DF; border-radius: 4px; background: #FEF3C7; color: #92400E; cursor: pointer;">+ company</button>
                <button type="button" onclick="insertVariable('{{1}}')" style="padding: 2px 6px; font-size: 11px; border: 1px solid #ECE8DF; border-radius: 4px; background: #FEF3C7; color: #92400E; cursor: pointer;">+ {{1}}</button>
              </div>
            </div>
            <textarea id="tplBody" class="form-textarea" rows="5" placeholder="Write message body with variables..." required oninput="updateLivePreview()"></textarea>
          </div>

          <div id="waFooterFields">
            <div class="form-group" style="margin-bottom: 16px;">
              <label class="form-label">Footer Text (Optional)</label>
              <input type="text" id="tplFooter" class="form-input" placeholder="e.g. Collectrr Direct" oninput="updateLivePreview()" />
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
            <button type="button" onclick="closeTemplateModal()" style="padding: 9px 16px; border: 1px solid #ECE8DF; background: #ffffff; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">Cancel</button>
            <button type="submit" id="saveBtn" style="padding: 9px 18px; border: none; background: #171717; color: #ffffff; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">Save Template</button>
          </div>
        </form>

        <!-- Right: Real-time Device Preview -->
        <div>
          <div style="font-size: 12px; font-weight: 600; color: #6E6A62; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.05em;">Live Preview</div>
          <div id="previewSimulator" style="background: #F4F3EF; border: 1px solid #ECE8DF; border-radius: 14px; padding: 20px; min-height: 280px;">
            <div id="previewCard" style="background: #ffffff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-size: 13px; line-height: 1.5;">
              <div id="previewHeader" style="font-weight: 600; margin-bottom: 8px; color: #171717; display: none;"></div>
              <div id="previewSubject" style="font-weight: 600; margin-bottom: 8px; color: #171717; display: none;"></div>
              <div id="previewBody" style="white-space: pre-wrap; color: #171717;">Type your message body to see preview...</div>
              <div id="previewFooter" style="font-size: 11px; color: #6E6A62; margin-top: 10px; border-top: 1px solid #F4F3EF; padding-top: 6px; display: none;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/templates.js"></script>
</body>
</html>
