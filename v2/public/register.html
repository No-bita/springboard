<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register — Springboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #F8F7F4;
        --surface: #FFFFFF;
        --border: #ECE8DF;
        --text: #171717;
        --muted: #6E6A62;
        --muted-soft: #6E6A62;
        --accent: #E36B2C;
        --accent-ring: rgba(227, 107, 44, 0.18);
        --btn-primary-bg: #171717;
        --btn-primary-hover: #2A2A2A;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
      }
      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 440px;
        box-shadow: none;
      }
      .brand-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }
      .brand-icon {
        width: 44px; height: 44px;
        background: #171717;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-weight: 600; font-size: 1.25rem;
      }
      .brand-title h1 { font-size: 24px; font-weight: 600; color: #171717; }
      .brand-title p { font-size: 13px; color: var(--muted); margin-top: 0.1rem; }

      .form-group { margin-bottom: 1.25rem; }
      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #171717;
        margin-bottom: 0.4rem;
      }
      .input-field {
        width: 100%;
        height: 44px;
        padding: 0 1rem;
        background: #FCFBF8;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: #171717;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
      }
      .input-field:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ring);
      }
      .btn-submit {
        width: 100%;
        height: 44px;
        padding: 0 1rem;
        background: var(--btn-primary-bg);
        color: #ffffff;
        font-weight: 500;
        font-size: 15px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: background 150ms ease-out;
        margin-top: 0.5rem;
      }
      .btn-submit:hover { background: var(--btn-primary-hover); }
      .error-alert {
        background: #FEE2E2;
        border: 1px solid #ECE8DF;
        color: #D84A3A;
        padding: 0.875rem;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 1.25rem;
      }
      .success-alert {
        background: #E6F4ED;
        border: 1px solid #C8E6D7;
        color: #1C8C5E;
        padding: 0.875rem;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a href="/" style="font-size: 13px; color: var(--muted); text-decoration: none;">← Back to Home</a>
      </div>
      <div class="brand-header">
        <div class="brand-icon">S</div>
        <div class="brand-title">
          <h1>Springboard</h1>
          <p>Create an Account</p>
        </div>
      </div>

      <div id="errorAlert" class="error-alert" hidden></div>
      <div id="successAlert" class="success-alert" hidden></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="input-field" placeholder="Choose a username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper" style="position: relative;">
            <input type="password" id="password" class="input-field" placeholder="Create a password (min 6 chars)" style="padding-right: 3.5rem;" required minlength="6" />
            <button type="button" id="togglePasswordBtn" class="toggle-pwd-btn" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #F0EEEA; border: 1px solid #E2DED5; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; z-index: 10; user-select: none; line-height: 1.2;">Show</button>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Register</button>
        <div style="text-align: center; margin-top: 1rem; font-size: 0.8125rem; color: var(--muted);">
          Already have an account? <a href="/login.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Sign in</a>
        </div>
      </form>
    </div>

    <script src="/js/register.js"></script>
  </body>
</html>
