<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Target Workspace — Collectrr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    body { background-color: #F8F7F4; margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; color: #171717; }
    .main-content { max-width: 1440px; margin: 0 auto; padding: 32px 40px; }
    .banner-card { background: #ffffff; border: 1px solid #ECE8DF; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .workspace-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; }
    @media (max-width: 960px) { .workspace-grid { grid-template-columns: 1fr; } }
    
    .panel-card { background: #ffffff; border: 1px solid #ECE8DF; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; }
    .panel-title { font-size: 17px; font-weight: 600; margin: 0 0 16px 0; color: #171717; display: flex; justify-content: space-between; align-items: center; }

    /* Conversation Stream */
    .chat-container { display: flex; flex-direction: column; gap: 12px; max-height: 480px; overflow-y: auto; padding: 12px 4px; }
    .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; }
    .chat-bubble.outbound { align-self: flex-end; background: #171717; color: #ffffff; border-bottom-right-radius: 2px; }
    .chat-bubble.inbound { align-self: flex-start; background: #F4F3EF; color: #171717; border-bottom-left-radius: 2px; }
    .chat-meta { font-size: 11px; margin-top: 4px; opacity: 0.7; display: flex; justify-content: flex-end; gap: 4px; }

    /* Requests Checklist */
    .request-card { background: #FAF9F6; border: 1px solid #ECE8DF; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .checklist-item { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 6px; }
    .checklist-item.done { text-decoration: line-through; opacity: 0.6; }

    /* Activity Stream */
    .timeline-item { display: flex; gap: 12px; font-size: 13px; margin-bottom: 14px; }
    .timeline-dot { width: 10px; height: 10px; border-radius: 999px; background: #2563EB; margin-top: 4px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="main-content">
    <!-- Top Navigation -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <a href="/dashboard.html" style="text-decoration: none; color: #6E6A62; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
        ← Back to Dashboard
      </a>
      <!-- Billing / Credits concept commented out
      <div style="display: flex; align-items: center; gap: 12px;">
        <span id="creditDisplayBadge" style="font-size: 13px; font-weight: 600; padding: 4px 10px; background: #FEF3C7; color: #92400E; border-radius: 999px;">⚡ Credits</span>
      </div>
      -->
    </div>

    <!-- Contact Banner -->
    <div class="banner-card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div style="display: flex; align-items: center; gap: 16px;">
          <div id="contactAvatar" style="width: 52px; height: 52px; border-radius: 999px; background: #171717; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600;">--</div>
          <div>
            <h1 id="clientName" style="font-size: 22px; font-weight: 700; margin: 0; color: #171717;">Loading Target...</h1>
            <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px; font-size: 14px; color: #6E6A62;">
              <span id="clientPhone">—</span>
              <span id="clientEmail"></span>
            </div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span id="clientStatusBadge" style="padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #F4F3EF; color: #171717;">Active</span>
        </div>
      </div>
    </div>

    <!-- 2-Column Workspace Grid -->
    <div class="workspace-grid">
      
      <!-- Left Column: Unified 2-Way Chat Stream & Composer -->
      <div class="panel-card" style="min-height: 580px;">
        <div class="panel-title">
          <span>Conversation</span>
          <span id="windowStatusText" style="font-size: 12px; font-weight: 500; color: #6E6A62;">WhatsApp</span>
        </div>

        <div id="customerWindowBanner" style="display: none; padding: 10px 14px; background: #FEF3C7; border: 1px solid #FDE68A; border-radius: 8px; font-size: 13px; color: #92400E; margin-bottom: 12px;">
          24-hour freeform messaging window is closed. Send a pre-approved template below.
        </div>

        <div class="chat-container" id="chatContainer">
          <div style="text-align: center; color: #9CA3AF; padding: 2rem;">Loading messages...</div>
        </div>

        <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid #ECE8DF;">
          <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <select id="channelSelect" onchange="onChannelChange()" style="padding: 8px 12px; border: 1px solid #ECE8DF; border-radius: 8px; font-size: 13px; background: #ffffff; font-weight: 500; cursor: pointer;">
              <option value="whatsapp">WhatsApp</option>
              <option value="email">Email</option>
              <option value="both">Both (WhatsApp + Email)</option>
            </select>
            <div id="templateSelectorContainer" style="flex: 1;">
              <select id="templateSelect" onchange="onTemplateSelectChange()" style="width: 100%; padding: 8px 12px; border: 1px solid #ECE8DF; border-radius: 8px; font-size: 13px; background: #ffffff;">
                <option value="new_convo_1" selected>New Outreach Template (new_convo_1)</option>
                <option value="hello_world">Meta Hello World (hello_world)</option>
                <option value="freeform" id="optFreeform" disabled>Direct Freeform Message (Disabled until target replies)</option>
              </select>
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="composerInput" placeholder="Template message will be sent..." style="flex: 1; padding: 10px 14px; border: 1px solid #ECE8DF; border-radius: 8px; font-size: 14px; outline: none;" />
            <button type="button" id="btnSendMessage" onclick="sendMessage()" style="padding: 10px 18px; background: #171717; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Send</button>
          </div>
        </div>
      </div>

      <!-- Right Column: Requests & Activity Log -->
      <div style="display: flex; flex-direction: column; gap: 24px;">
        
        <!-- Active Requests Panel (Commented out)
        <div class="panel-card">
          <div class="panel-title">
            <span>Requests & Tasks</span>
            <button type="button" onclick="openAddRequestModal()" style="font-size: 13px; font-weight: 500; background: #F4F3EF; border: 1px solid #ECE8DF; padding: 4px 10px; border-radius: 6px; cursor: pointer;">+ Add Request</button>
          </div>
          <div id="requestsList">
            <div style="color: #6E6A62; font-size: 13px; text-align: center; padding: 1rem;">No active requests.</div>
          </div>
        </div>
        -->

        <!-- Activity Feed -->
        <div class="panel-card">
          <div class="panel-title">
            <span>Activity & Notes</span>
          </div>

          <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <input type="text" id="noteInput" placeholder="Add an internal note..." style="flex: 1; padding: 8px 12px; border: 1px solid #ECE8DF; border-radius: 6px; font-size: 13px;" />
            <button type="button" onclick="addNote()" style="padding: 8px 14px; background: #F4F3EF; border: 1px solid #ECE8DF; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;">Add Note</button>
          </div>

          <div id="activityTimeline" style="max-height: 240px; overflow-y: auto;">
            <div style="color: #6E6A62; font-size: 13px; text-align: center; padding: 1rem;">Loading activity...</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Add Request Modal -->
  <div class="modal-backdrop" id="requestModalBackdrop" hidden style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: #ffffff; border-radius: 16px; width: 100%; max-width: 480px; padding: 24px; position: relative;">
      <button type="button" onclick="closeAddRequestModal()" style="position: absolute; top: 16px; right: 16px; border: none; background: none; font-size: 18px; cursor: pointer;">✕</button>
      <h3 style="margin: 0 0 16px 0; font-size: 17px;">Add New Request</h3>
      
      <form onsubmit="handleCreateRequest(event)">
        <div style="margin-bottom: 12px;">
          <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px;">Request Title</label>
          <input type="text" id="reqTitleInput" placeholder="e.g. Monthly GST Documents" required style="width: 100%; padding: 8px 12px; border: 1px solid #D1D5DB; border-radius: 6px; box-sizing: border-box;" />
        </div>
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px;">Checklist Items (one per line)</label>
          <textarea id="reqItemsInput" rows="3" placeholder="Form 16&#10;Bank Statement&#10;Invoice Copy" style="width: 100%; padding: 8px 12px; border: 1px solid #D1D5DB; border-radius: 6px; box-sizing: border-box;"></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" onclick="closeAddRequestModal()" style="padding: 8px 14px; border: 1px solid #ECE8DF; background: #ffffff; border-radius: 6px; cursor: pointer;">Cancel</button>
          <button type="submit" style="padding: 8px 16px; background: #171717; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Save Request</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/case-detail.js?v=4.0"></script>
</body>
</html>
